<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Luna Yoga Studio — A sanctuary for slow, intentional movement. Vinyasa, Yin, Restorative, and Breathwork classes in a sunlit space.">
  <title>Luna Yoga Studio — Breathe. Move. Be.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --sand: #E8DCC8;
      --sand-dark: #D4C4A8;
      --sage: #8A9A8A;
      --sage-dark: #6B7B6B;
      --off-white: #F5F0E8;
      --off-white-dark: #EDE5D9;
      --terracotta: #C6765A;
      --terracotta-dark: #A85D42;
      --dusk-pink: #D4A5A5;
      --dusk-pink-dark: #B88A8A;
      --ink: #2D2A26;
      --ink-light: #5A554F;
      --linen: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--off-white);
      background-image: var(--linen);
      color: var(--ink);
      line-height: 1.8;
      font-size: 1.0625rem;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 500;
      line-height: 1.3;
      color: var(--ink);
    }

    h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); letter-spacing: -0.02em; }
    h2 { font-size: clamp(1.75rem, 4vw, 2.75rem); letter-spacing: -0.01em; }
    h3 { font-size: clamp(1.25rem, 2.5vw, 1.75rem); }

    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    input, textarea { font-family: inherit; }

    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 2rem;
    }

    /* ===== UTILITIES ===== */
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94), transform 600ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .fade-up.is-visible { opacity: 1; transform: translateY(0); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 1rem 2.25rem;
      font-size: 0.9375rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      border-radius: 100px;
      transition: all 300ms ease;
    }
    .btn--primary { background: var(--sage); color: var(--off-white); }
    .btn--primary:hover { background: var(--sage-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(138, 154, 138, 0.3); }
    .btn--outline { border: 1.5px solid var(--sage); color: var(--sage); background: transparent; }
    .btn--outline:hover { background: var(--sage); color: var(--off-white); }
    .btn--terracotta { background: var(--terracotta); color: var(--off-white); }
    .btn--terracotta:hover { background: var(--terracotta-dark); }

    .section { padding: 6rem 0; }
    @media (min-width: 768px) { .section { padding: 9rem 0; } }

    .section-header { text-align: center; max-width: 640px; margin: 0 auto 4rem; }
    .section-header .eyebrow {
      display: block;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 1rem;
    }

    /* ===== HEADER / NAV ===== */
    .site-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: rgba(245, 240, 232, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(138, 154, 138, 0.15);
      transition: background 300ms ease;
    }
    .site-header.scrolled { background: rgba(245, 240, 232, 0.98); }

    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    .logo span { color: var(--sage); }

    .nav-links { display: none; gap: 2.5rem; list-style: none; }
    .nav-links a {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--ink-light);
      transition: color 200ms ease;
      position: relative;
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px; left: 0; right: 0;
      height: 1px;
      background: var(--sage);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 300ms ease;
    }
    .nav-links a:hover { color: var(--ink); }
    .nav-links a:hover::after { transform: scaleX(1); transform-origin: left; }

    .nav-cta { display: none; }

    .mobile-menu-btn { display: flex; flex-direction: column; gap: 5px; padding: 0.5rem; }
    .mobile-menu-btn span { width: 24px; height: 2px; background: var(--ink); border-radius: 2px; transition: all 300ms ease; }

    @media (min-width: 768px) {
      .nav-links { display: flex; }
      .nav-cta { display: block; }
      .mobile-menu-btn { display: none; }
    }

    /* ===== HERO ===== */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 72px;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      z-index: -1;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center;
      animation: breathe 8s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(45,42,38,0.15) 0%, rgba(45,42,38,0.35) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: var(--off-white);
      padding: 2rem;
      max-width: 800px;
    }

    .hero .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--dusk-pink);
      margin-bottom: 1.25rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.3s forwards;
    }

    .hero h1 {
      font-size: clamp(2.25rem, 7vw, 5rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 1.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.5s forwards;
    }

    .hero p {
      font-size: clamp(1.125rem, 2.5vw, 1.375rem);
      font-weight: 300;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto 2.5rem;
      opacity: 0;
      animation: fadeUp 1s ease 0.7s forwards;
    }

    .hero-cta { display: flex; flex-direction: column; gap: 1rem; align-items: center; opacity: 0; animation: fadeUp 1s ease 0.9s forwards; }
    @media (min-width: 480px) { .hero-cta { flex-direction: row; justify-content: center; } }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
      from { opacity: 0; transform: translateY(20px); }
    }

    .scroll-indicator {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      color: rgba(245,240,232,0.7);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      animation: bounce 2s ease-in-out infinite;
    }
    .scroll-indicator svg { width: 24px; height: 24px; stroke-width: 1.5; }

    @keyframes bounce { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }

    /* ===== PRACTICES ===== */
    .practices { background: var(--off-white); }

    .practices-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }
    @media (min-width: 640px) { .practices-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .practices-grid { grid-template-columns: repeat(4, 1fr); } }

    .practice-card {
      position: relative;
      aspect-ratio: 4/5;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
    }

    .practice-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .practice-card:hover .practice-image { transform: scale(1.08); }

    .practice-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(45,42,38,0.7) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
      color: var(--off-white);
    }

    .practice-name { font-size: 1.5rem; font-weight: 400; margin-bottom: 0.25rem; }
    .practice-desc { font-size: 0.875rem; opacity: 0.85; line-height: 1.6; }

    /* ===== TEACHERS ===== */
    .teachers { background: var(--sand); background-image: var(--linen); }

    .teachers-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }
    @media (min-width: 768px) { .teachers-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .teachers-grid { grid-template-columns: repeat(3, 1fr); } }

    .teacher-card {
      text-align: center;
      padding: 1.5rem;
    }

    .teacher-photo-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(138, 154, 138, 0.2);
    }

    .teacher-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 1.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .teacher-card:hover .teacher-photo { transform: scale(1.1); }

    .teacher-name { font-size: 1.375rem; margin-bottom: 0.25rem; }
    .teacher-style { font-size: 0.875rem; color: var(--sage); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 1.25rem; }

    .quote-wrap {
      position: relative;
      min-height: 60px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.0625rem;
      font-style: italic;
      line-height: 1.7;
      color: var(--ink-light);
      overflow: hidden;
    }

    .quote-text { display: block; }
    .quote-typed { display: block; min-height: 1.7em; }

    .teacher-card:hover .quote-text { display: none; }
    .teacher-card:hover .quote-typed { display: block; }

    /* ===== SCHEDULE ===== */
    .schedule { background: var(--off-white); }

    .schedule-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
    }

    .schedule-table thead {
      border-bottom: 1px solid rgba(138, 154, 138, 0.2);
    }

    .schedule-table th {
      text-align: left;
      padding: 1rem 1.25rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--sage);
    }

    .schedule-row {
      border-bottom: 1px solid rgba(138, 154, 138, 0.1);
      transition: background 300ms ease;
    }
    .schedule-row:hover { background: rgba(138, 154, 138, 0.04); }

    .schedule-row td { padding: 1.25rem; vertical-align: middle; }

    .class-time { font-family: 'DM Sans', sans-serif; font-weight: 500; color: var(--ink); }
    .class-name { font-weight: 500; }
    .class-teacher { color: var(--ink-light); font-size: 0.875rem; }
    .class-level { 
      display: inline-block;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border-radius: 100px;
      background: rgba(138, 154, 138, 0.15);
      color: var(--sage-dark);
    }

    .seats {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem;
    }
    .seats-count { font-weight: 600; color: var(--ink); }
    .seats-bar { width: 80px; height: 6px; background: rgba(138, 154, 138, 0.15); border-radius: 3px; overflow: hidden; }
    .seats-fill { height: 100%; background: var(--sage); border-radius: 3px; transition: width 500ms ease; }
    .seats-full { color: var(--terracotta); }

    .expand-btn {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      background: rgba(138, 154, 138, 0.1);
      color: var(--sage);
      transition: all 300ms ease;
    }
    .expand-btn:hover { background: var(--sage); color: var(--off-white); }
    .expand-btn svg { transition: transform 300ms ease; }
    .schedule-row.expanded .expand-btn svg { transform: rotate(180deg); }

    .schedule-detail {
      display: none;
      grid-column: 1 / -1;
      padding: 0 1.25rem 1.5rem;
      background: rgba(232, 220, 200, 0.5);
      animation: slideDown 300ms ease;
    }
    .schedule-row.expanded + .schedule-detail { display: block; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
      padding: 1.5rem 0;
    }
    @media (min-width: 640px) { .detail-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .detail-grid { grid-template-columns: repeat(4, 1fr); } }

    .detail-item { display: flex; flex-direction: column; gap: 0.375rem; }
    .detail-label { font-family: 'DM Sans', sans-serif; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); }
    .detail-value { color: var(--ink); }

    .detail-room { grid-column: 1 / -1; }
    @media (min-width: 640px) { .detail-room { grid-column: span 2; } }
    @media (min-width: 1024px) { .detail-room { grid-column: span 2; } }

    .room-image {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .room-image:hover { transform: scale(1.03); }

    /* Mobile schedule cards */
    .schedule-mobile { display: block; }
    @media (min-width: 768px) { .schedule-mobile { display: none; } }

    .schedule-card {
      background: var(--off-white-dark);
      border: 1px solid rgba(138, 154, 138, 0.15);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .schedule-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; }
    .schedule-card-time { font-family: 'DM Sans', sans-serif; font-weight: 600; }
    .schedule-card-body { display: grid; gap: 0.75rem; }
    .schedule-card-row { display: flex; justify-content: space-between; align-items: center; padding-bottom: 0.75rem; border-bottom: 1px solid rgba(138, 154, 138, 0.1); }
    .schedule-card-row:last-of-type { border-bottom: none; padding-bottom: 0; }

    /* ===== FIRST CLASS FREE ===== */
    .first-class { background: var(--ink); color: var(--off-white); background-image: var(--linen); position: relative; overflow: hidden; }
    .first-class::before {
      content: '';
      position: absolute;
      top: -50%; right: -20%;
      width: 60%; height: 200%;
      background: radial-gradient(ellipse, rgba(198, 118, 90, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .first-class .container { position: relative; z-index: 1; }

    .first-class .section-header { text-align: center; }
    .first-class .eyebrow { color: var(--terracotta); }
    .first-class h2 { color: var(--off-white); }

    .offer-card {
      max-width: 560px;
      margin: 0 auto;
      padding: 3rem 2.5rem;
      background: rgba(245, 240, 232, 0.04);
      border: 1px solid rgba(212, 165, 165, 0.2);
      border-radius: 24px;
      text-align: center;
    }

    .offer-badge {
      display: inline-block;
      padding: 0.5rem 1.25rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: var(--terracotta);
      color: var(--off-white);
      border-radius: 100px;
      margin-bottom: 1.5rem;
    }

    .offer-card h3 { color: var(--off-white); margin-bottom: 1rem; }
    .offer-card > p { color: rgba(245,240,232,0.7); margin-bottom: 2rem; }

    .form-group { display: flex; flex-direction: column; gap: 1rem; text-align: left; }
    .form-row { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    @media (min-width: 480px) { .form-row { grid-template-columns: 1fr 1fr; } }

    .form-field { display: flex; flex-direction: column; gap: 0.5rem; }
    .form-field label { font-family: 'DM Sans', sans-serif; font-size: 0.8125rem; font-weight: 500; color: rgba(245,240,232,0.8); }
    .form-field input,
    .form-field select {
      padding: 1rem 1.25rem;
      font-size: 1rem;
      background: rgba(245, 240, 232, 0.06);
      border: 1px solid rgba(212, 165, 165, 0.2);
      border-radius: 8px;
      color: var(--off-white);
      transition: all 200ms ease;
    }
    .form-field input::placeholder { color: rgba(245,240,232,0.4); }
    .form-field input:focus,
    .form-field select:focus {
      outline: none;
      border-color: var(--terracotta);
      background: rgba(245, 240, 232, 0.1);
    }

    .form-submit { margin-top: 0.5rem; width: 100%; }

    .form-note { font-size: 0.8125rem; color: rgba(245,240,232,0.5); text-align: center; margin-top: 1.5rem; }

    /* ===== FOOTER ===== */
    .site-footer {
      background: var(--ink);
      color: var(--off-white);
      padding: 4rem 0 2rem;
      background-image: var(--linen);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      margin-bottom: 3rem;
    }
    @media (min-width: 640px) { .footer-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .footer-grid { grid-template-columns: 2fr 1fr 1fr 1
