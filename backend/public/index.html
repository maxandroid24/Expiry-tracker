<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SĀDHANĀ | Boutique Yoga Studio & Sanctuary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-sand-light: #FAF6F0;
      --color-sand: #EFE7DC;
      --color-sand-dark: #DFD5C5;
      --color-sage-light: #E4ECE3;
      --color-sage: #80937A;
      --color-sage-dark: #475842;
      --color-terracotta: #C86D51;
      --color-terracotta-light: #FAF0ED;
      --color-dusk-pink: #E5B8AC;
      --color-charcoal: #2A2725;
      --color-muted: #6B655E;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      background-color: var(--color-sand-light);
      color: var(--color-charcoal);
      font-family: var(--font-sans);
      line-height: 1.7;
      overflow-x: hidden;
      background-image: radial-gradient(rgba(216, 203, 181, 0.25) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Typography */
    h1, h2, h3, h4 {
      font-family: var(--font-serif);
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    p {
      font-weight: 300;
      color: var(--color-muted);
    }

    .section-title {
      font-size: clamp(2.2rem, 4vw, 3.2rem);
      margin-bottom: 1rem;
      color: var(--color-charcoal);
    }

    .section-subtitle {
      font-size: 1.1rem;
      max-width: 580px;
      margin: 0 auto 3rem auto;
      color: var(--color-muted);
      font-weight: 300;
    }

    /* Fade Up Animation */
    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s var(--ease-out), transform 0.8s var(--ease-out);
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: rgba(250, 246, 240, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(223, 213, 197, 0.5);
      transition: all 0.3s ease;
    }

    .brand-logo {
      font-family: var(--font-serif);
      font-size: 1.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--color-charcoal);
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .brand-logo span.dot {
      width: 8px;
      height: 8px;
      background-color: var(--color-sage);
      border-radius: 50%;
      display: inline-block;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--color-charcoal);
      font-size: 0.95rem;
      font-weight: 400;
      letter-spacing: 0.03em;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--color-terracotta);
    }

    .audio-toggle {
      background: transparent;
      border: 1px solid var(--color-sand-dark);
      border-radius: 30px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      color: var(--color-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }

    .audio-toggle:hover {
      border-color: var(--color-sage);
      color: var(--color-sage-dark);
    }

    .btn-primary {
      background-color: var(--color-sage-dark);
      color: #FAF6F0;
      border: none;
      padding: 0.85rem 1.8rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
      display: inline-block;
    }

    .btn-primary:hover {
      background-color: var(--color-sage);
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(71, 88, 66, 0.15);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--color-charcoal);
      border: 1px solid var(--color-charcoal);
      padding: 0.85rem 1.8rem;
      border-radius: 40px;
      font-size: 0.95rem;
      font-weight: 400;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background-color: var(--color-sand);
      border-color: var(--color-sand-dark);
    }

    /* Hero Section */
    .hero {
      min-height: 100vh;
      padding: 9rem 3rem 4rem;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      align-items: center;
      gap: 4rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    .hero-content {
      max-width: 620px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: var(--color-sage-light);
      color: var(--color-sage-dark);
      font-size: 0.85rem;
      padding: 0.4rem 1.1rem;
      border-radius: 20px;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .hero-title {
      font-size: clamp(3rem, 5.5vw, 4.8rem);
      margin-bottom: 1.5rem;
      color: var(--color-charcoal);
      font-style: italic;
    }

    .hero-title span {
      font-style: normal;
      display: block;
      color: var(--color-sage-dark);
    }

    .hero-description {
      font-size: 1.15rem;
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .hero-actions {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      flex-wrap: wrap;
    }

    .breath-box {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 480px;
      border-radius: 200px 200px 24px 24px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(42, 39, 37, 0.08);
    }

    /* Breath Animation Cycle (4s) */
    .breath-visual {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: breathCycle 4s ease-in-out infinite alternate;
      transform-origin: center center;
    }

    @keyframes breathCycle {
      0% {
        transform: scale(1);
        filter: brightness(0.95);
      }
      100% {
        transform: scale(1.08);
        filter: brightness(1.05);
      }
    }

    .breath-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(42, 39, 37, 0.1) 0%, rgba(42, 39, 37, 0.35) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.5rem;
      color: #FAF6F0;
    }

    .breath-tracker {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: rgba(250, 246, 240, 0.2);
      backdrop-filter: blur(8px);
      padding: 0.8rem 1.2rem;
      border-radius: 30px;
      width: max-content;
    }

    .breath-ring {
      width: 16px;
      height: 16px;
      border: 2px solid #FAF6F0;
      border-radius: 50%;
      animation: ringPulse 4s ease-in-out infinite alternate;
    }

    @keyframes ringPulse {
      0% { transform: scale(0.8); opacity: 0.5; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    .breath-text {
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #FAF6F0;
    }

    /* Section Common */
    section {
      padding: 7rem 3rem;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* Practices Section */
    .practices-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 2rem;
    }

    .practice-card {
      background-color: #FAF6F0;
      border: 1px solid var(--color-sand-dark);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.4s var(--ease-out);
    }

    .practice-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 16px 32px rgba(42, 39, 37, 0.06);
      border-color: var(--color-sage);
    }

    .ken-burns-container {
      width: 100%;
      height: 240px;
      overflow: hidden;
      position: relative;
    }

    .ken-burns-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 2.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .practice-card:hover .ken-burns-img {
      transform: scale(1.1);
    }

    .practice-content {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .practice-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--color-terracotta);
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .practice-title {
      font-size: 1.8rem;
      margin-bottom: 0.8rem;
    }

    .practice-desc {
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      flex: 1;
    }

    .practice-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid var(--color-sand);
      font-size: 0.85rem;
      color: var(--color-muted);
    }

    /* Teacher Bios */
    .teachers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2.5rem;
    }

    .teacher-card {
      background: var(--color-sand);
      border-radius: 20px;
      padding: 2rem;
      transition: transform 0.4s var(--ease-out);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
    }

    .teacher-card:hover {
      transform: translateY(-6px);
      background: #F5EEE4;
    }

    .teacher-avatar-wrap {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 1.5rem;
      border: 3px solid var(--color-sand-light);
      box-shadow: 0 8px 16px rgba(0,0,0,0.06);
    }

    .teacher-avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 2s ease;
    }

    .teacher-card:hover .teacher-avatar {
      transform: scale(1.12);
    }

    .teacher-name {
      font-size: 1.7rem;
      margin-bottom: 0.3rem;
    }

    .teacher-role {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-sage-dark);
      margin-bottom: 1.2rem;
      font-weight: 500;
    }

    .quote-box {
      background: var(--color-sand-light);
      border-radius: 12px;
      padding: 1.2rem;
      width: 100%;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--color-sand-dark);
    }

    .teacher-quote {
      font-family: var(--font-serif);
      font-size: 1.05rem;
      font-style: italic;
      color: var(--color-charcoal);
      line-height: 1.5;
    }

    .teacher-quote::before {
      content: '“';
    }
    .teacher-quote::after {
      content: '”';
    }

    /* Class Schedule */
    .schedule-container {
      background-color: #FAF6F0;
      border: 1px solid var(--color-sand-dark);
      border-radius: 24px;
      padding: 2.5rem;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.03);
    }

    .day-selector {
      display: flex;
      gap: 0.8rem;
      overflow-x: auto;
      padding-bottom: 1rem;
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--color-sand);
    }

    .day-btn {
      background: transparent;
      border: 1px solid var(--color-sand-dark);
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      font-size: 0.9rem;
      cursor: pointer;
      white-space: nowrap;
      color: var(--color-muted);
      transition: all 0.3s ease;
    }

    .day-btn.active,
    .day-btn:hover {
      background-color: var(--color-sage-dark);
      color: #FAF6F0;
      border-color: var(--color-sage-dark);
    }

    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .schedule-row {
      border: 1px solid var(--color-sand);
      border-radius: 16px;
      background: #FFFFFF;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .schedule-header {
      padding: 1.2rem 1.8rem;
      display: grid;
      grid-template-columns: 100px 1.5fr 1fr 140px 40px;
      align-items: center;
      gap: 1.5rem;
      cursor: pointer;
    }

    .schedule-header:hover {
      background: #FCFAF7;
    }

    .time-badge {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      color: var(--color-charcoal);
      font-weight: 500;
    }

    .class-info h4 {
      font-size: 1.3rem;
      margin-bottom: 0.2rem;
    }

    .class-instructor {
      font-size: 0.85rem;
      color: var(--color-muted);
    }

    .seat-pill {
      font-size: 0.8rem;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      display: inline-block;
      text-align: center;
      font-weight: 500;
    }

    .seat-pill.available {
      background-color: var(--color-sage-light);
      color: var(--color-sage-dark);
    }

    .seat-pill.limited {
      background-color: var(--color-terracotta-light);
      color: var(--color-terracotta);
    }

    .expand-icon {
      font-size: 1.2rem;
      color: var(--color-muted);
      transition: transform 0.3s ease;
      text-align: center;
    }

    .schedule-row.expanded .expand-icon {
      transform: rotate(180deg);
    }

    .schedule-details {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s var(--ease-out), padding 0.4s ease;
      background-color: var(--color-sand-light);
      border-top: 1px solid transparent;
    }

    .schedule-row.expanded .schedule-details {
      max-height: 300px;
      padding: 1.5rem 1.8rem;
      border-top-color: var(--color-sand);
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      font-size: 0.9rem;
    }

    .details-item h5 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      margin-bottom: 0.3rem;
    }

    /* First Class Free Section */
    .free-class-section {
      background-color: var(--color-sage-light);
      border-radius: 32px;
      padding: 5rem 3rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
    }

    .free-class-content h2 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: var(--color-sage-dark);
    }

    .capture-form {
      background: #FFFFFF;
      padding: 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(71, 88, 66, 0.08);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--color-charcoal);
    }

    .form-control {
      padding: 0.85rem 1.1rem;
      border: 1px solid var(--color-sand-dark);
      border-radius: 12px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      background-color: #FAF6F0;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--color-sage);
      background-color: #FFFFFF;
    }

    /* Footer */
    footer {
      background-color: var(--color-charcoal);
      color: var(--color-sand-light);
      padding: 5rem 3rem 2rem;
    }

    .footer-inner {
      max-width: 1300px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1.5fr;
      gap: 3rem;
      margin-bottom: 4rem;
    }

    .footer-brand h3 {
      font-size: 2rem;
      margin-bottom: 1rem;
      color: var(--color-sand);
    }

    .footer-col h4 {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      color: var(--color-sand-dark);
    }

    .footer-col ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .footer-col a {
      color: #BFB9B0;
      text-decoration: none;
      font-size: 0.9rem;
      transition: color 0.3s ease;
    }

    .footer-col a:hover {
      color: #FFFFFF;
    }

    .footer-bottom {
      max-width: 1300px;
      margin: 0 auto;
      padding-top: 2rem;
      border-top: 1px solid rgba(239, 231, 220, 0.15);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #9E978F;
    }

    /* Modal Confirmation */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(42, 39, 37, 0.6);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-card {
      background: #FAF6F0;
      padding: 3rem;
      border-radius: 28px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      transform: translateY(20px);
      transition: transform 0.4s var(--ease-out);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      background: var(--color-sage-light);
      color: var(--color-sage-dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem;
    }

    /* Responsive */
    @media (max-width: 992px) {
      .hero {
        grid-template-columns: 1fr;
        padding-top: 7rem;
        gap: 3rem;
      }
      .breath-box {
        height: 380px;
      }
      .free-class-section {
        grid-template-columns: 1fr;
        padding: 3rem 2rem;
      }
      .footer-inner {
        grid-template-columns: 1fr 1fr;
      }
      .schedule-header {
        grid-template-columns: 80px 1fr 100px 30px;
      }
      .schedule-header .teacher-name-col {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 1rem 1.5rem;
      }
      .nav-links {
        display: none;
      }
      section {
        padding: 4rem 1.5rem;
      }
      .footer-inner {
        grid-template-columns: 1fr;
      }
      .schedule-header {
        grid-template-columns: 70px 1fr 30px;
      }
      .seat-pill {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class=
